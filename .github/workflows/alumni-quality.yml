name: Alumni Quality

on:
  push:
    branches:
      - main
    paths:
      - "alumni-web/**"
      - ".github/workflows/alumni-quality.yml"
  pull_request:
    paths:
      - "alumni-web/**"
      - ".github/workflows/alumni-quality.yml"

concurrency:
  group: alumni-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 12

    defaults:
      run:
        working-directory: alumni-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alumni-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

